name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          fail=0
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*'); do
            node --check "$f" || fail=1
          done
          exit $fail

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run end-to-end suite
        run: node engine/src/e2e.js
